<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jev Desk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand">Jev Desk <span class="tag">影子交易台 · 只读</span></div>
    <div class="spacer"></div>
    <button id="theme" class="ghost" type="button" aria-label="切换深浅色">◐ 自动</button>
  </header>

  <main>
    <section class="page">
      <div class="kpis" id="desk-kpis"></div>
      <div class="card">
        <div class="card-head"><div><h2>持仓</h2><p class="sub">按开仓时的真实盘口模拟成交，没有真实下单。</p></div></div>
        <div class="table-wrap" id="open-positions"></div>
      </div>
      <div class="grid2">
        <div id="verdict-card"></div>
        <div class="card">
          <div class="card-head"><div><h2>校准</h2><p class="sub">每个市场取第一次判断，结算后对比。Brier 越低越准。</p></div></div>
          <div id="desk-calibration"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div><h2>最近的 Jev 判断</h2><p class="sub">p = Jev 认为第一个结果发生的概率；市场价不会给 Jev 看。</p></div></div>
        <div class="table-wrap" id="recent"></div>
      </div>
      <div class="card">
        <div class="card-head"><div><h2>已平仓</h2></div></div>
        <div class="table-wrap" id="closed-positions"></div>
      </div>
    </section>
  </main>

  <div id="tooltip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
